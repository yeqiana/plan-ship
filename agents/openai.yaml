interface:
  display_name: "PlanShip"
  short_description: "Evidence-driven planning, review, testing & acceptance / 方案评审、真实测试与验收"
  default_prompt: "Use $plan-ship for this coding task. Load ai-coding-collaboration before analyzing code and intelligent-ui before rendering. Inspect real project files and optional test-dir; ask once only for essential missing fixtures. Deliver a scoped plan with two substantive review/revision rounds, minimal implementation, genuine test evidence, and a manual acceptance guide with an understandable companion. For Chinese requests, follow 方案编写、方案实施测试验收、全流程 and 大白话解释 rules; never fake PASS or push remotely without explicit permission."
policy:
  allow_implicit_invocation: true
