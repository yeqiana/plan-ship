interface:
  display_name: "PlanShip"
  short_description: "Evidence-driven planning, review, testing & acceptance / 方案评审、真实测试与验收"
  default_prompt: "Use $plan-ship for this coding task. Check code-pact (https://github.com/yeqiana/code-pact) and gen-ui (https://github.com/yeqiana/gen-ui); automatically install missing dependencies into an existing host Skills directory using PlanShip preflight, then actually load code-pact before analyzing code and gen-ui before rendering. Inspect real project files and optional test-dir; ask once only for essential missing fixtures. Deliver a scoped plan with two substantive review/revision rounds, minimal implementation, genuine test evidence, and a manual acceptance guide with an understandable companion. For Chinese requests, follow 方案编写、方案实施测试验收、全流程 and 大白话解释 rules; never fake PASS or push remotely without explicit permission."
policy:
  allow_implicit_invocation: true
